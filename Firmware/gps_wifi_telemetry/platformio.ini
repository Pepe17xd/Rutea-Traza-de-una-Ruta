[platformio]
default_envs = gps_wifi_test

[env:gps_wifi_test]
platform = platformio/espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
lib_deps = mikalhart/TinyGPSPlus@1.1.0
build_flags =
    -D RUTEA_ENABLE_TELEMETRY=0
    -D RUTEA_TELEMETRY_ONE_SHOT=1

[env:gps_wifi_oneshot]
extends = env:gps_wifi_test
build_flags =
    -D RUTEA_ENABLE_TELEMETRY=1
    -D RUTEA_TELEMETRY_ONE_SHOT=1
