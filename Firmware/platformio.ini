[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
# Uses maintained Arduino-ESP32 framework APIs and a bounded, in-tree parser.

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
build_src_filter = -<*>
