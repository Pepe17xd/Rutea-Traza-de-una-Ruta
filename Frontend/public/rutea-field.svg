<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">RUTEA cuida los cultivos</title>
  <desc id="desc">Un robot fumigador recorre una pequeña Tierra de cultivo bajo un sol amarillo; sus hileras reverdecen mientras avanza.</desc>
  <style>
    .camera{transform-box:view-box;transform-origin:50% 54%;animation:camera-pull 16s cubic-bezier(.45,0,.2,1) infinite}
    .traveller{transform-box:view-box;transform-origin:0 0;animation:rover-journey 16s cubic-bezier(.45,0,.35,1) infinite}
    .spray{animation:spray-puff 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
    .sprout{transform-box:fill-box;transform-origin:center bottom;animation:sprout-grow 16s ease-in-out infinite}
    .sprout:nth-of-type(2n){animation-delay:.6s}.sprout:nth-of-type(3n){animation-delay:1.1s}
    .sun-halo{transform-box:fill-box;transform-origin:center;animation:sun-breathe 5s ease-in-out infinite}
    .orbit-dash{animation:orbit-flow 18s linear infinite}
    @keyframes camera-pull{0%,10%{transform:scale(1.52)}32%,90%{transform:scale(1)}100%{transform:scale(1.52)}}
    @keyframes rover-journey{
      0%{transform:translate(255px,495px) scale(1.3);opacity:0}
      6%{transform:translate(300px,495px) scale(1.3);opacity:1}
      15%{transform:translate(365px,475px) scale(1.12);opacity:1}
      30%{transform:translate(330px,405px) scale(.72);opacity:1}
      40%{transform:translate(315px,400px) scale(.7);opacity:1}
      52%{transform:translate(485px,440px) scale(.68);opacity:1}
      64%{transform:translate(510px,525px) scale(.82);opacity:1}
      75%{transform:translate(340px,592px) scale(1);opacity:1}
      85%{transform:translate(160px,535px) scale(.86);opacity:1}
      94%{transform:translate(180px,430px) scale(.68);opacity:1}
      98%,100%{transform:translate(255px,495px) scale(1.3);opacity:0}
    }
    @keyframes spray-puff{from{opacity:.36;transform:scale(.8)}to{opacity:.95;transform:scale(1.16)}}
    @keyframes sprout-grow{0%,19%{opacity:0;transform:scaleY(.08)}34%,82%{opacity:1;transform:scaleY(1)}100%{opacity:.5;transform:scaleY(.8)}}
    @keyframes sun-breathe{0%,100%{opacity:.75;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
    @keyframes orbit-flow{to{stroke-dashoffset:-120}}
    @media(prefers-reduced-motion:reduce){.camera,.traveller,.spray,.sprout,.sun-halo,.orbit-dash{animation:none!important}.sprout{opacity:1!important;transform:none!important}}
  </style>
  <defs>
    <linearGradient id="sky" x1="355" y1="0" x2="355" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#101b13"/><stop offset=".6" stop-color="#34472a"/><stop offset="1" stop-color="#6b7040"/></linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="matrix(0 175 -175 0 551 166)" gradientUnits="userSpaceOnUse"><stop stop-color="#fff6c2"/><stop offset=".18" stop-color="#f5d86b"/><stop offset=".46" stop-color="#dcae48" stop-opacity=".5"/><stop offset="1" stop-color="#dcae48" stop-opacity="0"/></radialGradient>
    <linearGradient id="planet" x1="360" y1="315" x2="360" y2="775" gradientUnits="userSpaceOnUse"><stop stop-color="#836344"/><stop offset=".44" stop-color="#594633"/><stop offset="1" stop-color="#273722"/></linearGradient>
    <linearGradient id="soil-row" x1="350" y1="379" x2="350" y2="740" gradientUnits="userSpaceOnUse"><stop stop-color="#c09762" stop-opacity=".58"/><stop offset="1" stop-color="#604a31" stop-opacity=".08"/></linearGradient>
    <linearGradient id="rover-shell" x1="302" y1="396" x2="439" y2="489" gradientUnits="userSpaceOnUse"><stop stop-color="#d4df93"/><stop offset="1" stop-color="#869f4f"/></linearGradient>
    <linearGradient id="rover-glass" x1="357" y1="405" x2="408" y2="443" gradientUnits="userSpaceOnUse"><stop stop-color="#8ba991"/><stop offset="1" stop-color="#20372d"/></linearGradient>
    <clipPath id="planet-clip"><ellipse cx="360" cy="568" rx="383" ry="259"/></clipPath>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>

  <g class="camera">
    <!-- A warm, late-afternoon sky -->
    <path d="M0 0h720v472H0z" fill="url(#sky)"/>
    <path d="M0 0h720v470H0z" fill="url(#sun)"/>
    <g class="sun-halo">
      <circle cx="552" cy="162" r="54" fill="#f6d76d" fill-opacity=".16" filter="url(#soft-glow)"/>
      <circle cx="552" cy="162" r="38" fill="#efd064"/>
      <circle cx="552" cy="162" r="31" fill="#f6df83"/>
      <path d="M537 168c7-7 22-7 30 0" stroke="#cc9c42" stroke-opacity=".68" stroke-width="2" stroke-linecap="round"/>
      <circle cx="541" cy="155" r="2" fill="#a47a37"/><circle cx="562" cy="155" r="2" fill="#a47a37"/>
    </g>
    <g fill="#dce6bd" fill-opacity=".65">
      <circle cx="83" cy="92" r="1.5"/><circle cx="188" cy="132" r="1"/><circle cx="385" cy="78" r="1.4"/><circle cx="641" cy="76" r="1.2"/>
    </g>
    <path d="M0 360c79-45 139-54 209-18 64-59 143-67 218-20 78-54 169-48 293 13v143H0V360Z" fill="#26392b"/>
    <path d="M0 402c91-42 169-34 247 5 78-39 163-42 245-4 75-36 152-30 228 13v104H0V402Z" fill="#354b30"/>
    <path d="M62 397c44-12 70-10 106 3m286-11c42-15 81-12 119 4" stroke="#8b9b55" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>

    <!-- The cultivated world: brown soil, curved rows, young green plants -->
    <ellipse cx="360" cy="568" rx="383" ry="259" fill="url(#planet)" stroke="#b7c87a" stroke-opacity=".62" stroke-width="2"/>
    <g clip-path="url(#planet-clip)">
      <path d="M-30 399c153-62 349-78 780-18v395H-30V399Z" fill="#654c35" fill-opacity=".63"/>
      <path d="M-30 426c155-55 326-68 780-8M-30 470c143-41 337-54 780-2M-30 526c142-29 348-40 780-1M-30 593c137-18 350-25 780 1M-30 666c133-9 351-11 780 5" stroke="#362d24" stroke-opacity=".82" stroke-width="13" stroke-linecap="round"/>
      <path d="M-30 417c155-59 326-72 780-11M-30 459c143-45 337-56 780-4M-30 514c142-32 348-43 780-4M-30 581c137-21 350-28 780-2M-30 654c133-12 351-14 780 2" stroke="url(#soil-row)" stroke-width="3" stroke-linecap="round"/>
      <path d="M-28 742c115-103 224-196 388-310m30 313c-51-113-112-215-184-319m548 319c-116-103-224-196-388-310m-33 310c53-116 113-217 185-319" stroke="#b48957" stroke-opacity=".32" stroke-width="3"/>

      <g class="sprout" stroke="#a9c867" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M111 551v-27m0 16c-15 0-22-8-23-19 12 0 19 5 23 14m0-7c11-12 20-14 29-10-3 11-12 17-25 18"/>
      </g>
      <g class="sprout" stroke="#b7d275" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M176 609v-31m0 18c-16-1-23-9-24-21 12 0 20 5 24 15m0-8c12-13 21-14 30-10-4 12-13 18-26 19"/>
      </g>
      <g class="sprout" stroke="#9fbd5e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M536 546v-35m0 20c-18 0-26-9-28-23 15 0 24 6 28 17m0-9c14-14 24-16 35-11-4 13-15 20-30 21"/>
      </g>
      <g class="sprout" stroke="#b1c96c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M584 630v-32m0 19c-16 0-24-8-25-21 13 0 21 5 25 15m0-8c12-13 22-14 31-10-4 12-13 18-27 19"/>
      </g>
      <g class="sprout" stroke="#a9c867" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M88 684v-23m0 13c-12 0-17-6-18-16 10 0 15 4 18 11m0-6c9-9 16-10 23-7-3 9-10 13-20 14"/>
        <path d="M634 699v-25m0 14c-12 0-18-6-19-16 10 0 16 4 19 11m0-6c9-9 16-11 23-7-3 9-10 13-20 14"/>
      </g>
    </g>

    <!-- A light orbital route around the whole field -->
    <ellipse class="orbit-dash" cx="360" cy="568" rx="391" ry="271" stroke="#d4dd9b" stroke-opacity=".38" stroke-width="2" stroke-dasharray="3 13"/>
    <path d="m65 473 8 2-5 7" stroke="#f2d978" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="665" cy="598" r="4" fill="#f2d978"/><circle cx="665" cy="598" r="9" stroke="#f2d978" stroke-opacity=".35"/>

    <!-- Cute field rover with a tank and wide, gentle spray -->
    <g class="traveller">
      <g transform="translate(-58,-42)">
        <ellipse cx="66" cy="92" rx="80" ry="12" fill="#10150e" fill-opacity=".46"/>
        <!-- broad spray arms -->
        <path d="M-72 15h42m193 0h44" stroke="#aebc79" stroke-width="4" stroke-linecap="round"/>
        <path d="M-70 15h40m193 0h42" stroke="#e2e8c5" stroke-opacity=".75" stroke-width="1.3" stroke-linecap="round"/>
        <g class="spray" fill="#e4efc2" fill-opacity=".84">
          <path d="m-51 18 3 10-3 5-3-5 3-10Zm-21 22 2 7-2 4-2-4 2-7Zm48-22 3 10-3 5-3-5 3-10Zm218 0 3 10-3 5-3-5 3-10Zm22 22 2 7-2 4-2-4 2-7Zm21-22 3 10-3 5-3-5 3-10Z"/>
          <circle cx="-58" cy="42" r="2"/><circle cx="-20" cy="37" r="1.6"/><circle cx="221" cy="41" r="2"/><circle cx="255" cy="35" r="1.6"/>
        </g>
        <!-- wheels and rounded chassis -->
        <rect x="2" y="64" width="33" height="29" rx="12" fill="#202b1d" stroke="#9eaf64" stroke-width="2"/>
        <rect x="94" y="64" width="33" height="29" rx="12" fill="#202b1d" stroke="#9eaf64" stroke-width="2"/>
        <circle cx="18" cy="78" r="7" fill="#82964d"/><circle cx="110" cy="78" r="7" fill="#82964d"/>
        <path d="M15 54c0-11 9-19 21-19h64c15 0 25 9 25 22v14H15V54Z" fill="url(#rover-shell)" stroke="#e2e9b8" stroke-width="2"/>
        <path d="M38 39h52c11 0 18 6 18 16v5H29v-5c0-10 3-16 9-16Z" fill="url(#rover-glass)" stroke="#cbd99a" stroke-width="2"/>
        <circle cx="54" cy="49" r="4" fill="#f5e69a"/><circle cx="78" cy="49" r="4" fill="#f5e69a"/>
        <path d="M57 57c5 4 13 4 18 0" stroke="#d28b59" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="56" cy="50" r="1.4" fill="#fff7cd"/><circle cx="80" cy="50" r="1.4" fill="#fff7cd"/>
        <!-- little liquid tank and leaf mark -->
        <rect x="39" y="11" width="48" height="28" rx="10" fill="#718943" stroke="#d4e0a0" stroke-width="2"/>
        <path d="M63 17c-9 7-9 12 0 17 9-5 9-10 0-17Z" fill="#f1edca"/>
        <path d="M63 19v12" stroke="#91a85a" stroke-width="1.4"/>
        <path d="M61 10V5h5" stroke="#e3e8c6" stroke-width="2" stroke-linecap="round"/>
        <circle cx="-29" cy="15" r="3" fill="#f0d56b"/><circle cx="207" cy="15" r="3" fill="#f0d56b"/>
        <path d="M-18 5c5-7 12-7 17 0m182 0c5-7 12-7 17 0" stroke="#cfdb91" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
