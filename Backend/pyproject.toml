[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hector-backend"
version = "1.0.0"
description = "Coordinacion y telemetria de navegacion HECTOR"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6",
  "pyproj>=3.6", "pydantic-settings>=2.2",
  "boto3>=1.34", "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3", "PyYAML>=6.0"]
ml = ["numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]
aws = ["mangum>=0.19"]
hardware = ["pyserial>=3.5", "smbus2>=0.4.3; platform_system == 'Linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-rutea-aws"

[tool.setuptools.packages.find]
where = ["."]

